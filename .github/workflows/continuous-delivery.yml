name: continuous-delivery
on:
  pull_request:
  workflow_dispatch:
    inputs:
      cnpg_branch:
        description: "Name of the branch/tag used to build & load the operator (leave empty for default)"
        required: false
      test_depth:
        description: 'E2E test level: 0(highest) to 4(lowest) (leave empty for default)'
        required: false
      feature_type:
        description: 'E2E feature type filter. See https://github.com/cloudnative-pg/cloudnative-pg/blob/main/contribute/e2e_testing_environment/README.md#using-feature-type-test-selectionfilter'
        required: false
      barman_plugin:
        description: 'plugin-barman-cloud version to install: release (default), main, or a pinned version like v0.12.0'
        required: false
  schedule:
  - cron:  '0 1 * * *'

defaults:
  run:
    # default failure handling for shell scripts in 'run' steps
    shell: 'bash -Eeuo pipefail -x {0}'

permissions: read-all

jobs:
  prepare:
    name: Evaluate inputs
    runs-on: ubuntu-24.04
    outputs:
      pg_major: ${{ env.PG_MAJOR }}
      cnpg_branch: ${{ env.CNPG_BRANCH }}
      test_depth: ${{ env.TEST_DEPTH }}
      feature_type: ${{ env.FEATURE_TYPE }}
      barman_plugin: ${{ env.BARMAN_PLUGIN }}
      minimal_tags: ${{ env.MINIMAL_TAGS }}
      standard_tags: ${{ env.STANDARD_TAGS }}
      postgis_tags: ${{ env.POSTGIS_TAGS }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set env variables from defaults.json
      run: |
        for key in $(jq -r 'keys[]' defaults.json); do
          echo "$key=$(cat defaults.json | jq -r --arg key "$key" '.[$key]')" >> $GITHUB_ENV
        done

    # Inputs have priority over defaults.json.
    - name: Evaluate E2E workflow inputs
      env:
        INPUT_CNPG_BRANCH: ${{ github.event.inputs.cnpg_branch }}
        INPUT_TEST_DEPTH: ${{ github.event.inputs.test_depth }}
        INPUT_FEATURE_TYPE: ${{ github.event.inputs.feature_type }}
        INPUT_BARMAN_PLUGIN: ${{ github.event.inputs.barman_plugin }}
      run: |
        if [[ -n "${INPUT_CNPG_BRANCH}" ]]; then
          echo "CNPG_BRANCH=${INPUT_CNPG_BRANCH}" >> $GITHUB_ENV
        fi
        if [[ -n "${INPUT_TEST_DEPTH}" ]]; then
          echo "TEST_DEPTH=${INPUT_TEST_DEPTH}" >> $GITHUB_ENV
        fi
        if [[ -n "${INPUT_FEATURE_TYPE}" ]]; then
          echo "FEATURE_TYPE=${INPUT_FEATURE_TYPE}" >> $GITHUB_ENV
        fi
        if [[ -n "${INPUT_BARMAN_PLUGIN}" ]]; then
          echo "BARMAN_PLUGIN=${INPUT_BARMAN_PLUGIN}" >> $GITHUB_ENV
        fi

    # Compute the final (arch-less) tags up front, once, so that both the
    # amd64 and arm64 legs of the build (native runners, no QEMU emulation —
    # see reusable-build.yml) push under the same tags for the 'merge' job to
    # combine into multi-arch manifests. Mirrors the naming scheme baked into
    # docker-bake.hcl's default target (distro comes from its `base` matrix
    # entry, currently pinned to debian:trixie-slim).
    - name: Compute image tags
      run: |
        registry="ghcr.io/${{ github.repository_owner }}/postgresql-trunk"
        distro="trixie"
        timestamp="$(date -u +%Y%m%d%H%M)"
        for tgt in MINIMAL STANDARD POSTGIS; do
          lower="${tgt,,}"
          echo "${tgt}_TAGS=${registry}:${PG_MAJOR}-${lower}-${distro},${registry}:${PG_MAJOR}-${timestamp}-${lower}-${distro}" >> $GITHUB_ENV
        done

  build-pg:
    name: Build the Trunk of PostgreSQL
    needs: prepare
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
    with:
      pg_major: ${{ needs.prepare.outputs.pg_major }}
      revision: ${{ github.sha }}
      minimal_tags: ${{ needs.prepare.outputs.minimal_tags }}
      standard_tags: ${{ needs.prepare.outputs.standard_tags }}
      postgis_tags: ${{ needs.prepare.outputs.postgis_tags }}
      # On pull_request runs, only build each arch to validate the Dockerfile
      # compiles — don't push anything or publish a multi-arch manifest.
      push: ${{ github.event_name != 'pull_request' }}

  select-pg-image:
    name: Select the image built for E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-pg
    runs-on: ubuntu-24.04
    outputs:
      pg_image: ${{ steps.select.outputs.pg_image }}
    steps:
      - name: Pick the timestamped minimal image
        id: select
        env:
          BUILD_PG_IMAGES: ${{ needs.build-pg.outputs.images }}
        run: |
          echo "pg_image=$(echo "${BUILD_PG_IMAGES}" | grep minimal | grep -oP '[^,]*\d{12}[^,]*')" >> $GITHUB_OUTPUT

  call-reusable-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - select-pg-image
    uses: ./.github/workflows/reusable-e2e.yml
    permissions:
      packages: write
    with:
      postgres_img: ${{ needs.select-pg-image.outputs.pg_image }}
      major_version: ${{ needs.prepare.outputs.pg_major }}
      cnpg_branch: ${{ needs.prepare.outputs.cnpg_branch }}
      test_depth: ${{ needs.prepare.outputs.test_depth }}
      feature_type: ${{ needs.prepare.outputs.feature_type }}
      barman_plugin: ${{ needs.prepare.outputs.barman_plugin }}
